[tool.poetry]
name = "analyzer-d4-passivedns"
version = "0.6.0"  # Bumped to reflect refactor
description = "A Passive DNS server and analyzer for D4 network sensors, supporting multiple ingestion sources (CSV, NDJSON, JSON, WebSocket, Redis) and a FastAPI-based API."
authors =  ["info@circl.lu"]
license = "AGPL-3.0"
readme = "README.md"
packages = [{ include = "pdns" }]  # Explicitly include pdns/ as a package

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Core dependencies for refactored project
fastapi = "^0.115.0"  # Replaces tornado for API
uvicorn = "^0.30.0"   # ASGI server for FastAPI
aioredis = ">=1.3.1,<2.0.0"   # Async Redis client (1.x API with create_redis_pool)
pydantic = "^2.9.2"   # For schemas
pypdns = "^1.0"       # Passive DNS record handling
slowapi = "^0.1.9"    # Rate limiting for FastAPI
iptools = "^0.7.0"    # IP validation in routes
aiofiles = "^23.2"    # Async file I/O for ingestors
websockets = "^12.0"  # WebSocket ingestor
python-dotenv = "^1.0"  # .env support in default/helpers
jinja2 = "^3.1"        # Templating for notifiers
dnspython = "^2.6"     # DNS lookups for DNSBL filters
aiohttp = "^3.9"       # HTTP client for webhook and Matrix notifiers
aiosmtplib = "^3.0"    # Async SMTP client for mail notifier

# Optional dependencies from original project
redis = { version = ">=5.2.1,<6.0.0", optional = true }  # For synchronous Redis (if still used)
ndjson = ">=0.3.1,<0.4.0"  # For NDJSON parsing
websocket-client = { version = ">=1.8.0,<2.0.0", optional = true }  # For sync WebSocket (if still used)
tornado = { version = ">=6.4.2,<7.0.0", optional = true }  # For backwards compatibility
scapy = "^2.6.1"
protobuf = "^6.30.2"
fstrm = "^0.6.1"
dnstap-pb = "^0.11.3"

[tool.poetry.extras]
legacy = ["redis", "ndjson", "websocket-client", "tornado"]  # Group original deps as optional

[tool.poetry.scripts]
# Updated CLI entry points
pdns-import = "pdns.cli:main"  # Maps to cli.py (adjust if split into specific importers)
pdns-ingestion = "pdns.cli:main"  # Unified ingestion script
validate-config = "tools.validate_config_files:main"  # New validation script

# Primary CLI entry point
pdns = "pdns.cli:main"

# Removed pdns-import-cof (assumed merged into cli.py) and install-kvrocks (bash script not portable in Poetry)

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
flake8 = "^7.2.0"
black = "^25.1.0"
mypy = "^1.15.0"
types-requests = "^2.32.0.20250328"
mkdocs-material = "^9.6.11"
mkdocs = "^1.6.1"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.11"

[build-system]
requires = ["poetry-core>=1.0.0"]  # Updated to a stable Poetry version
build-backend = "poetry.core.masonry.api"
