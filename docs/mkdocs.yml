site_name: analyzer-d4-passivedns Documentation
site_description: Documentation for the analyzer-d4-passivedns project, a Redis-backed passive DNS database.
site_author: D4 Project
repo_url: https://github.com/D4-project/analyzer-d4-passivedns
theme:
  name: material
  palette:
    primary: teal
    accent: amber
  features:
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
  logo: assets/logo.png
  favicon: assets/favicon.ico
nav:
  - Home: index.md
  - User Guide:
      - Getting Started: user/getting-started.md
      - Querying DNS Records: user/querying-dns.md
      - API Reference: user/api-reference.md
      - Schemas: user/schemas.md
  - Admin Guide:
      - Installation: admin/installation.md
      - Configuration: admin/configuration.md
      - Ingestors: admin/ingestors.md
      - Notifiers: admin/notifiers.md
      - Troubleshooting: admin/troubleshooting.md
  - Developer Guide:
      - Contributing: dev/contributing.md
      - Codebase Overview: dev/codebase-overview.md
      - Adding Ingestors: dev/adding-ingestors.md
      - Adding Notifiers: dev/adding-notifiers.md
      - Testing: dev/testing.md
      - API Development: dev/api-development.md
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
docs_dir: .
